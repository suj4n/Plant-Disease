name: plantdoc
description: AI-powered plant disease detection app for Nepali farmers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.7.0
  
  # Animations
  flutter_animate: ^4.5.2
  
  # State Management
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  
  # Image handling
  image_picker: ^1.2.2
  
  # Camera (live scan viewfinder)
  camera: ^0.12.0+1
  
  # Utilities
  intl: ^0.20.2
  http: ^1.2.2
  shared_preferences: ^2.5.3
  path: ^1.9.1
  sqflite: ^2.4.2
  uuid: ^4.5.1

  # Plant tracker — local DB & reminders
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - .env

  # Bundled rather than fetched at runtime: google_fonts downloads from
  # fonts.gstatic.com on first use, so a device that is offline on first launch
  # threw an unhandled exception and fell back to the system typeface.
  # These are the variable files, so weights come from fontVariations.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
