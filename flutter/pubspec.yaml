name: plantdoc
description: AI-powered plant disease detection app for Nepali farmers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.7.0
  
  # UI & Design
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  
  # Charts & Progress
  fl_chart: ^1.2.0
  percent_indicator: ^4.2.3
  
  # Animations
  flutter_animate: ^4.5.2
  
  # State Management
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  
  # Image handling
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  
  # Camera & ML
  camera: ^0.12.0+1
  # tflite_flutter: ^0.10.4  # For on-device ML
  
  # Utilities
  intl: ^0.20.2
  http: ^1.2.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - .env


# Note: Inter is provided via the `google_fonts` package; local font files removed to avoid missing asset errors.
